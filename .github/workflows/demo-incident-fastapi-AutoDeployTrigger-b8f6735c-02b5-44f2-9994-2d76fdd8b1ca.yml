name: Trigger auto deployment for demo-incident-fastapi

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/demo-incident-fastapi-AutoDeployTrigger-b8f6735c-02b5-44f2-9994-2d76fdd8b1ca.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.DEMOINCIDENTFASTAPI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.DEMOINCIDENTFASTAPI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.DEMOINCIDENTFASTAPI_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: 
          registryUsername: ${{ secrets.DEMOINCIDENTFASTAPI_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.DEMOINCIDENTFASTAPI_REGISTRY_PASSWORD }}
          containerAppName: demo-incident-fastapi
          resourceGroup: Mexico-Laboratorios
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


